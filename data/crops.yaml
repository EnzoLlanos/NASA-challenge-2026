# =============================================================================
# data/crops.yaml — Rasgos de cultivos adaptables a San Luis, Argentina
# =============================================================================
# Región piloto: San Luis, Argentina (lat -33.30, lon -65.30) — clima semi-árido
# Período de referencia climático: 2000-2025 (NASA POWER)
#
# Propósito: conectar las variables climáticas procesadas por el pipeline
# (power_monthly.csv) con los rasgos de cada cultivo, para que el motor de
# puntuación (scoring/engine.py) calcule el score de cada rotación.
#
# Compatible con el schema Pydantic `CropInfo` del equipo Backend:
#   name, water_consumption, drought_tolerance, nitrogen_fixation, root_depth,
#   soil_coverage, organic_matter, market_potential, adaptation_notes
#   (+ campos extra `season` y `cycle_months` que Pydantic ignora por defecto
#    y que sirven al motor para armar rotaciones verano/invierno).
#
# FORMATO DE VALORES (unidades explícitas — error #1 al unir datasets):
#   water_consumption : mm de agua por ciclo completo (FAO-56 / INTA, aprox.)
#   drought_tolerance : fracción 0-1 (1 = tolera sequía extrema)
#   nitrogen_fixation : booleano (leguminosas fijadoras de N2)
#   root_depth        : cm de profundidad máxima del sistema radicular
#   soil_coverage     : fracción 0-1 de cobertura del suelo en pico
#   organic_matter    : % de materia orgánica aportada por ciclo (seco/base)
#   market_potential  : cualitativo "alto" | "medio" | "bajo" (mercado local SL)
#   season            : "verano" | "invierno" | "cubierta" (ventana de siembra)
#   cycle_months      : meses de duración del ciclo (entero)
#
# ⚠️ PROVENIENCIA / HONESTIDAD DE LOS VALORES:
#   Son ESTIMACIONES agronómicas de referencia (FAO/INTA/publicaciones
#   regionales), NO mediciones de lote. Requieren validación con técnico
#   local. Esta limitación debe aparecer en `data_gaps` de la API.
# =============================================================================

maíz:
  name: "Maíz"
  water_consumption: 500        # mm por ciclo completo (verano)
  drought_tolerance: 0.3        # 0-1; sensible a estrés hídrico en floración
  nitrogen_fixation: false      # no fija nitrógeno
  root_depth: 150               # cm; raíces moderadas
  soil_coverage: 0.8            # fracción 0-1 en pico (buena cobertura)
  organic_matter: 0.05          # % de MO aportada por ciclo (rastrojo alto)
  market_potential: "alto"      # mercado local y exportación (grano)
  season: "verano"              # ventana: oct-dic (siembra en San Luis)
  cycle_months: 6               # meses del ciclo completo
  adaptation_notes: |
    Cultivo de verano por excelencia en San Luis. Alta demanda hídrica
    (500 mm/ciclo), requiere buena disponibilidad de agua en floración.
    Sensible a sequía en etapa crítica (drought_tolerance 0.3).
    Rastrojo alto que protege el suelo. Rotación típica: maíz → soja.
    Riesgo: olas de calor (>=35°C) en enero-febrero según NASA POWER.

soja:
  name: "Soja"
  water_consumption: 450        # mm por ciclo (verano, algo menos que maíz)
  drought_tolerance: 0.5        # 0-1; más tolerante que el maíz
  nitrogen_fixation: true       # fija N2 atmosférico (reduce fertilización)
  root_depth: 80                # cm; sistema radicular más superficial
  soil_coverage: 0.7            # fracción 0-1
  organic_matter: 0.03          # % de MO aportada por ciclo
  market_potential: "alto"      # principal mercado de exportación de SL
  season: "verano"              # ventana: nov-ene
  cycle_months: 5               # meses del ciclo completo
  adaptation_notes: |
    Buena alternativa al maíz en rotación. Fija nitrógeno, deja N para el
    cultivo siguiente y reduce necesidad de fertilizantes. Menor demanda
    hídrica que el maíz (450 vs 500 mm). Cobertura moderada. Muy común en
    la rotación maíz-soja de Argentina. Sensible a heladas tardías.

trigo:
  name: "Trigo"
  water_consumption: 350        # mm por ciclo (invierno)
  drought_tolerance: 0.8        # 0-1; alta tolerancia a sequía
  nitrogen_fixation: false      # no fija nitrógeno
  root_depth: 120               # cm; raíces medianas
  soil_coverage: 0.9            # fracción 0-1; buena cobertura en invierno
  organic_matter: 0.07          # % de MO aportada por ciclo (mayor rastrojo)
  market_potential: "medio"     # mercado local/region menor que maíz-soja
  season: "invierno"            # ventana: may-jul (cubre suelo en invierno)
  cycle_months: 7               # meses del ciclo completo
  adaptation_notes: |
    Cultivo de invierno en San Luis: cubre el suelo justo en la época en
    que está desnudo (mayo-agosto), reduce erosión y evita campos
    descubiertos. Alta tolerancia a sequía (0.8) — clave bajo clima
    semi-árido. Precede bien al maíz de verano. Sensible a heladas
    tardías (seguimiento de frost_days del pipeline) y calor prematuro.

sorgo:
  name: "Sorgo"
  water_consumption: 300        # mm por ciclo (verano, muy ahorrativo)
  drought_tolerance: 0.9        # 0-1; cultivo de sequía por excelencia
  nitrogen_fixation: false      # no fija nitrógeno
  root_depth: 200               # cm; raíces profundas que exploran el suelo
  soil_coverage: 0.7            # fracción 0-1
  organic_matter: 0.04          # % de MO aportada por ciclo
  market_potential: "medio"     # grano/forraje, mercado local
  season: "verano"              # ventana: nov-dic
  cycle_months: 5               # meses del ciclo completo
  adaptation_notes: |
    Sustituto de maíz en años secos: consume 40% menos agua (300 vs 500 mm)
    y raíces profundas (200 cm) que extraen humedad en capas bajas. Es el
    cultivo de referencia para el componente "agua" del score en una
    región semi-árida como San Luis. Menor cobertura que el maíz.

girasol:
  name: "Girasol"
  water_consumption: 300        # mm por ciclo (verano)
  drought_tolerance: 0.85       # 0-1; tolera sequía por raíz profunda
  nitrogen_fixation: false      # no fija nitrógeno
  root_depth: 250               # cm; una de las raíces más profundas
  soil_coverage: 0.6            # fracción 0-1; copa más abierta
  organic_matter: 0.04          # % de MO aportada por ciclo
  market_potential: "alto"      # aceite — demanda creciente, buen precio
  season: "verano"              # ventana: nov-dic
  cycle_months: 5               # meses del ciclo completo
  adaptation_notes: |
    Raíz de hasta 250 cm: rompe compactación y aporta agua/nutrientes de
    capas profundas (buen precedente para cereales). Tolera sequía (0.85).
    Aceitera con mercado alto. Menor cobertura (0.6): considerar cobertura
    de invierno para no dejar el suelo expuesto. Buen candidato para
    rotar con trigo de invierno.

cebada:
  name: "Cebada"
  water_consumption: 300        # mm por ciclo (invierno)
  drought_tolerance: 0.85       # 0-1; muy tolerante al frío y sequía
  nitrogen_fixation: false      # no fija nitrógeno
  root_depth: 100               # cm
  soil_coverage: 0.9            # fracción 0-1; cobertura inviernal densa
  organic_matter: 0.06          # % de MO aportada por ciclo
  market_potential: "medio"     # cervecería/forraje, mercado regional
  season: "invierno"            # ventana: may-jul
  cycle_months: 6               # meses del ciclo completo
  adaptation_notes: |
    Alternativa de invierno al trigo con menor exigencia hídrica y muy
    tolerante al frío. Cubre el suelo en la ventana de campo desnudo
    (junio-agosto) y su rastrojo mejora la materia orgánica. Mercado
    medio (cervecería/forraje) — buen complemento si la prioridad del
    agricultor es suelo antes que ingresos.

arveja:
  name: "Arveja"
  water_consumption: 200        # mm por ciclo (invierno, muy baja demanda)
  drought_tolerance: 0.75       # 0-1; resistente en invierno seco
  nitrogen_fixation: true       # fija N2 — leguminosa de cobertura
  root_depth: 60                # cm; raíces superficiales
  soil_coverage: 0.95           # fracción 0-1; cobertura casi total
  organic_matter: 0.08          # % de MO aportada por ciclo (mayor aporte)
  market_potential: "bajo"      # grano/forraje propio, poco mercado externo
  season: "cubierta"            # ventana: abr-jul (cobertura de invierno)
  cycle_months: 4               # meses del ciclo completo
  adaptation_notes: |
    Cultivo de cobertura de invierno: 95% de cobertura protege el suelo
    desnudo de mayo a agosto (ventana crítica de erosión en San Luis),
    fija nitrógeno para el cultivo de verano siguiente y aporta el mayor
    % de materia orgánica (0.08). Bajo valor de mercado directo — su
    "ingreso" es el ahorro de fertilizante y la salud del suelo.
    Estrategia clave para la prioridad "suelo" y "erosión" del agricultor.
